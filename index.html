    <script>
      // Aplica o tema antes do React montar para evitar flash de tema errado.
      // Escuro é o padrão da marca FisgarOne (igual ao site): sem preferência
      // salva, abre escuro — nunca uma tela branca.
      try {
        var t = localStorage.getItem('calc-pro-theme')
        if (t !== 'light') document.documentElement.classList.add('dark')
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
